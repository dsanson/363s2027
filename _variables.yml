    description: |
      Are there "joints" in reality, and so objectively correct ways to group things into categories and kinds? 
      Or are all such joints a projection of our ways of dividing things onto a jointless reality? In this class, we explore
      this question through the lens of recent work on both the metaphysics and epistemology of natural, artifactual, and social concepts and kinds.
